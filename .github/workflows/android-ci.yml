name: SiteMind AI Enterprise Android & FastAPI CI/CD

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build-android:
    name: Android Build, Lint & Robolectric Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Signed Production Android App Bundle (AAB)
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sitemind-release-aab
          path: app/build/outputs/bundle/release/*.aab

  fastapi-backend-check:
    name: FastAPI Backend Lint & Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run FastAPI Route Smoke Check
        run: |
          cd backend
          python -c "import app.main; print('FastAPI App successfully initialized')"
